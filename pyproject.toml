[project]
name = "windgrid-de"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "entsoe-py>=0.8.1",
    "matplotlib>=3.11.2",
    "open-mastr>=1.0.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E501"]
